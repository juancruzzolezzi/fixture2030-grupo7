# Hito 13 - Monitoreo del Fixture 2030. Parte del compose de la clase, con cuatro cambios:
#  - volumenes nombrados en lugar de ${HOME}/docker/data (devolucion del Hito 6);
#  - la password de Grafana sale del .env (RNF6);
#  - se agregan los exporters de Redis y MongoDB de la Clase 13 (MongoDB con tag fijo, no latest);
#  - host.docker.internal tambien anda en Linux (extra_hosts).
# Las seis bases siguen en el compose del Hito 10 y la API corre en la notebook.
name: fixture2030-monitoreo

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fixture2030-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus:/etc/prometheus/reglas:ro
      - h13_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: fixture2030-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta GRAFANA_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - h13_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # En Docker Desktop mide la VM donde corren los contenedores, no Windows.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: fixture2030-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: fixture2030-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379

  # Usuario y password salen del .env del Hito 10 (ver scripts/iniciar_monitoreo.sh).
  # La imagen no publica el tag latest que usa la Clase 13: se fija la 0.53.
  mongodb-exporter:
    image: percona/mongodb_exporter:0.53
    container_name: fixture2030-mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_USER: ${MONGO_USER:?falta MONGO_USER en el .env del Hito 10}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en el .env del Hito 10}
    command:
      - '--mongodb.uri=mongodb://host.docker.internal:27017/admin'
      - '--mongodb.direct-connect'
      - '--collector.dbstats'
      - '--collector.diagnosticdata'

volumes:
  h13_prometheus_data:
  h13_grafana_data:
