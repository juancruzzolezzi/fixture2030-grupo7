services:
  mongodb:
    image: mongo:7.0
    container_name: h10-mongodb
    restart: unless-stopped
    environment:
      # Usuario y password salen del .env (no se versiona). Solo se aplican la
      # primera vez que se crea el volumen.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}
      MONGO_INITDB_DATABASE: fixture2030
    ports:
      - "27017:27017"
    volumes:
      - h10_mongo_data:/data/db
      - ./scripts/mongo/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:latest
    container_name: h10-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?falta NEO4J_PASSWORD en .env}"
    volumes:
      - h10_neo4j_data:/data
      - h10_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  cassandra:
    image: cassandra:latest
    container_name: h10-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - h10_cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  redis:
    image: redis:latest
    container_name: h10-redis
    restart: unless-stopped
    # maxmemory y politica del Hito 7: el compose integrado no los tenia y
    # redis_memory_max_bytes daba 0 (lo encontramos armando el monitoreo del Hito 13).
    command: redis-server --save 60 1 --loglevel notice --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - h10_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  influxdb:
    image: influxdb:3-core
    pull_policy: always
    container_name: h10-influxdb
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=fixture2030-hito10
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      # Se monta la carpeta padre: existe en la imagen con dueño influxdb3, asi el
      # volumen nombrado hereda ese permiso (montado en .../data da PermissionDenied).
      - h10_influxdb_data:/var/lib/influxdb3

  # Un bind mount no admite chown (lo necesita Durable %SYS) en este host: el
  # mismo problema que el Hito 9 documenta para Windows. Se resuelve igual,
  # con un volumen administrado por Docker y un servicio que lo prepara antes
  # de que IRIS arranque (ver docker-compose.windows.yml del Hito 9).
  iris-init:
    image: intersystems/iris-community:latest-cd
    user: root
    entrypoint: ["chown", "irisowner:irisowner", "/durable"]
    volumes:
      - h10_iris_durable:/durable

  iris:
    image: intersystems/iris-community:latest-cd
    container_name: h10-iris
    restart: unless-stopped
    depends_on:
      iris-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1972:1972"
      - "127.0.0.1:52773:52773"
    environment:
      - ISC_DATA_DIRECTORY=/durable
    volumes:
      - h10_iris_durable:/durable
      - ./scripts/iris:/scripts:ro,z

# Todos los datos en volumenes nombrados (devolucion del Hito 6: el bind mount
# ~/docker/data/... no es el volumen nombrado que pide RNF2).
volumes:
  h10_mongo_data:
  h10_cassandra_data:
  h10_redis_data:
  h10_influxdb_data:
  h10_neo4j_data:
  h10_neo4j_logs:
  h10_iris_durable:
